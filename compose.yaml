name: hss-finance

services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hss_finance}
      POSTGRES_USER: ${POSTGRES_USER:-hss_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hss_finance_dev}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 10s

volumes:
  postgres_data:
    name: hss-finance-postgres-data
